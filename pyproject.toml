[project]
name = "calisthenics-ai-service"
version = "0.1.0"
description = "Calisthenics AI service"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.136.3",
    "numpy>=2.5.0",
    "opencv-python-headless>=4.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.6",
    "torch==2.12.1+cpu",
    "torchvision",
    "ultralytics>=8.0.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.24.0",
    "pytest>=7.4.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]