name: Calisthenics AI Service - CI/CD & Image Publish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before build'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-ai-service-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: AI Service CI (Test & Validate)
  # ----------------------------------------------------------------------------
  ai-ci:
    name: AI Service CI (PyTest & Routes)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: 'latest'

      - name: Install Runtime & Test Dependencies
        run: uv sync --frozen

      - name: Run PyTest Suite
        if: ${{ !inputs.skip_tests }}
        env:
          YOLO_VERBOSE: "False"
        run: uv run pytest -v

      - name: Validate FastAPI Route Initialization
        env:
          YOLO_VERBOSE: "False"
        run: |
          uv run python -c "import app.main; print('FastAPI service initialized successfully')"

  # ----------------------------------------------------------------------------
  # Job 2: Build & Push AI Service Docker Image to GHCR
  # ----------------------------------------------------------------------------
  build-and-push-ai:
    name: Build & Push AI Service Image to GHCR
    needs: ai-ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag_sha }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compute Image Metadata
        id: meta
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_OWNER_LOWER}/calisthenics-ai-service"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag_sha=${IMAGE}:${SHA}" >> $GITHUB_OUTPUT
          echo "tag_short=${IMAGE}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_latest=${IMAGE}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push AI Service Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_short }}
            ${{ steps.meta.outputs.tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize AI Service Build
        run: |
          echo "### 🚀 AI Service Image Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: \`${{ steps.meta.outputs.tag_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest**: \`ghcr.io/${{ github.repository_owner }}/calisthenics-ai-service:latest\`" >> $GITHUB_STEP_SUMMARY
